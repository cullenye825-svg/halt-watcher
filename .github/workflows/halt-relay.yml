name: Halt relay

# Self-perpetuating watcher. NO `schedule:` trigger anywhere in this file.
#
# WHY: GitHub's cron is effectively dead for this repo. Measured 2026-08-31 to
# 2026-09-01: ~2 of ~28 due fires delivered, survivors 51 min to 7h33m late. A
# purpose-built canary at off-peak minutes, deployed by a fresh push (GitHub's
# own documented "resync" remedy), delivered 0 of 5 fires in 2.5 hours.
# `workflow_dispatch`, by contrast, has fired 12 of 12 times, instantly.
#
# So the chain runs on workflow_dispatch alone. Each link watches for `minutes`
# and, three minutes before it stops, dispatches its own successor. The overlap
# means handover has no coverage gap.
#
# This works with the built-in GITHUB_TOKEN because workflow_dispatch is one of
# the two documented exceptions to "events triggered by the GITHUB_TOKEN will
# not create a new workflow run". No personal access token is required.
#
# THE CHAIN'S WEAKNESS: it is a chain. If a link's runner dies before the
# handoff fires, the safety-net step dies with it and nothing else would
# restart the chain. That happened on 2026-10-03 at 15:22 UTC ("The hosted
# runner lost communication with the server") and the chain stayed down until
# it was dispatched by hand on 2026-10-06.
#
# THE FIX (relay_guard.py): every chain link now has a `buddy` job on a SECOND
# runner. It never watches halts; it waits for this link's `relay` job and, if
# that ends (or overruns its window) with no newer link watching, the
# `restart` job dispatches a new link and says so on Telegram -- recovery in
# minutes. relay-watchdog.yml is the cron backstop for anything a buddy cannot
# see (both runners lost, an Actions outage). Restarts from either path are
# serialised through one concurrency group and re-checked before dispatching,
# so they can never start two chains. The silent Telegram "online" heartbeat at
# the start of every link remains the tripwire for everything else.
#
# A link with minutes < 60 is treated as a one-off TEST: it watches, but never
# hands off. That keeps experiments from spawning an unstoppable fast chain.
# Its buddy runs as a DRILL: the full check runs, the restart job runs dry,
# and nothing is dispatched or sent. A 5-minute run is the end-to-end test.
#
# To start it:  Actions -> Halt relay -> Run workflow  (defaults are correct)
# To stop it:   cancel the in-flight run(s); no successor will be created.
#               Cancelling a run cancels its buddy too, and the watchdog reads
#               a link whose relay and buddy jobs were both cancelled as a
#               deliberate stop.

# The inputs are in the title so relay_guard.py can tell chain links from
# test links without reading logs.
run-name: "Halt relay (${{ inputs.minutes || '330' }} min, handoff ${{ inputs.handoff || 'true' }})"

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes this link watches before handing off'
        required: false
        default: '330'
      handoff:
        description: 'Dispatch a successor? Set false for a one-off test link.'
        required: false
        default: 'true'
      drill_alert:
        description: 'Test links only (minutes < 60): first send one silent synthetic DRILL alert with the decision buttons.'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write        # required to dispatch the successor

jobs:
  relay:
    runs-on: ubuntu-latest
    # Job ceiling is 6h. 330 min of watching + overlap + slack stays under it.
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - name: Refuse to pile up
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Normal states are 1 in-flight link, or 2 during the 3-minute
          # handover overlap. Anything more means duplicate dispatches, so this
          # link stands down and lets the existing ones carry on.
          N=$(gh run list --workflow halt-relay.yml --status in_progress \
                --json databaseId --jq 'length' 2>/dev/null || echo 1)
          echo "relay links in flight (including me): $N"
          if [ "${N:-1}" -gt 2 ]; then
            echo "Too many links in flight - standing down (not an error)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Watch halts, and hand off before exiting
        if: steps.guard.outputs.go == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: '8'
          HALT_STATE: ${{ runner.temp }}/halt_state.json
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
          HANDOFF: ${{ inputs.handoff }}
          DRILL_ALERT: ${{ inputs.drill_alert }}
        run: |
          set -u
          MINUTES="${MINUTES:-330}"
          UNTIL=$(TZ=America/New_York date -d "+${MINUTES} minutes" +%H:%M)
          HANDOFF_AT=$(( (MINUTES - 3) * 60 ))
          [ "$HANDOFF_AT" -lt 30 ] && HANDOFF_AT=30

          echo "watching until ${UNTIL} ET; handoff in $((HANDOFF_AT / 60)) min"

          # Arm the successor in the background, inside this same step so it
          # shares the step's lifetime. It fires 3 minutes before this link
          # stops, giving a real overlap rather than a gap. If the watcher
          # below dies early, the `wait` still lets this timer complete, so a
          # crashed watcher does not by itself break the chain.
          # A short link is a TEST. Tests must be self-terminating: a 6-minute
          # link handing off every 3 minutes creates a chain that spawns
          # successors faster than a human can cancel them (learned the hard
          # way on 2026-09-01). Below 60 minutes, never hand off.
          if [ "$MINUTES" -lt 60 ]; then
            echo "minutes=$MINUTES is a test link - handoff suppressed"
            HANDOFF=false
            if [ "${DRILL_ALERT:-false}" = "true" ]; then
              python3 halt_watcher.py --drill || echo "DRILL ALERT FAILED"
            fi
          fi

          if [ "${HANDOFF:-true}" = "true" ]; then
            (
              sleep "$HANDOFF_AT"
              echo "handing off to the next link"
              gh workflow run halt-relay.yml \
                 -f minutes="$MINUTES" -f handoff=true \
                 || echo "HANDOFF FAILED - chain will stop after this link"
            ) &
            HANDOFF_PID=$!
          else
            echo "handoff disabled for this link (one-off test)"
            HANDOFF_PID=""
          fi

          # No --all-hours: the watcher polls every 8s during 09:25-16:10 ET and
          # backs off to 5 minutes outside it, so overnight links cost little.
          python3 halt_watcher.py --announce --until "$UNTIL" || \
            echo "watcher exited non-zero; still waiting for the handoff"

          if [ -n "$HANDOFF_PID" ]; then
            wait "$HANDOFF_PID" 2>/dev/null || true
          fi

      - name: Safety net - ensure a successor exists
        # NOT always(): that fires on cancellation too, which would make the
        # chain impossible to stop. Cancelling a link is the deliberate way
        # to halt the chain, so a cancelled link must not spawn a successor.
        if: (success() || failure()) && inputs.handoff == 'true'
            && steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the background handoff never fired (step cancelled mid-sleep,
          # gh transient failure), create the successor now rather than let the
          # chain die silently.
          # Count OTHER links only -- excluding this run by id -- so we can tell
          # "a successor exists" apart from "only I am left".
          OTHERS=$(gh run list --workflow halt-relay.yml --status in_progress \
                     --json databaseId --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" \
                   2>/dev/null || echo 99)
          echo "other links in flight at exit: $OTHERS"
          if [ "${{ inputs.minutes }}" -lt 60 ]; then
            echo "test link - not resurrecting the chain"
          elif [ "${OTHERS:-99}" -eq 0 ]; then
            echo "no successor found - dispatching one"
            gh workflow run halt-relay.yml \
               -f minutes="${{ inputs.minutes }}" -f handoff=true
          else
            echo "successor already running"
          fi

  buddy:
    # Sits beside the relay job on its OWN runner, so a runner that dies takes
    # only one of the two with it. Never watches halts. Polls this run's
    # `relay` job once a minute; when it ends, or is still marked running five
    # minutes past its window, checks whether a newer link is watching and, if
    # not, asks the `restart` job below for a new link.
    if: inputs.handoff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    outputs:
      restart: ${{ steps.wait.outputs.restart }}
      drill: ${{ steps.wait.outputs.drill }}
      reason: ${{ steps.wait.outputs.reason }}
      since: ${{ steps.wait.outputs.since }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait beside the watcher, then check for a successor
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes }}
        run: python3 relay_guard.py buddy --minutes "${MINUTES:-330}"

  restart:
    needs: buddy
    if: needs.buddy.outputs.restart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One restart at a time, shared with relay-watchdog.yml. The job re-checks
    # once it holds the group and keeps holding it until the new link is
    # listed, so a second request finds that link and does nothing.
    concurrency:
      group: halt-relay-restart
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Restart the chain unless something is already watching
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MINUTES: ${{ inputs.minutes }}
          REASON: ${{ needs.buddy.outputs.reason }}
          SINCE: ${{ needs.buddy.outputs.since }}
          DRILL: ${{ needs.buddy.outputs.drill }}
        run: |
          python3 relay_guard.py restart --minutes "${MINUTES:-330}" \
            --reason "$REASON" --since "$SINCE" --drill "$DRILL"
