name: Keepalive

# GitHub disables scheduled workflows in a repo that has had no activity for
# 60 days. Workflow runs do not count as activity — a commit does. This pushes
# a one-line timestamp every Monday so the halt watcher never goes silent.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"last keepalive: %Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "halt-watcher-bot"
          git config user.email "halt-watcher-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || exit 0
          git push
