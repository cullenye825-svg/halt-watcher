name: Halt watcher (morning)

# GitHub caps a single job at 6 hours, so the session is split into a morning
# and an afternoon leg. Cron here is ALWAYS UTC, so each leg is scheduled twice
# (once for EDT, once for EST) and a guard step exits the wrong one immediately.

on:
  schedule:
    - cron: '20 13 * * 1-5'   # 09:20 ET when US is on EDT
    - cron: '20 14 * * 1-5'   # 09:20 ET when US is on EST
  workflow_dispatch:           # start it by hand from the Actions tab
    inputs:
      minutes:
        description: 'Manual run: how many minutes to watch for'
        required: false
        default: '10'

# Least privilege: these jobs only need to read the repo. The repo-wide
# default is read/write (the keepalive job needs it to push), and a workflow
# can only REDUCE that ceiling, never raise it -- so we reduce it here.
permissions:
  contents: read

concurrency:
  group: halt-watcher-morning
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run, and until when
        id: guard
        run: |
          ET=$(TZ=America/New_York date +%H%M)
          echo "New York time is $ET"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run is always allowed and is short by default, so a test
            # click can't accidentally pin a runner for hours.
            MINS="${{ inputs.minutes }}"
            UNTIL=$(TZ=America/New_York date -d "+${MINS:-10} minutes" +%H:%M)
            echo "Manual run — watching until $UNTIL ET."
            echo "go=true"        >> "$GITHUB_OUTPUT"
            echo "until=$UNTIL"   >> "$GITHUB_OUTPUT"
          elif [ "$ET" -ge "0900" ] && [ "$ET" -le "0945" ]; then
            echo "go=true"        >> "$GITHUB_OUTPUT"
            echo "until=12:50"    >> "$GITHUB_OUTPUT"
          else
            echo "Wrong DST leg — exiting cleanly."
            echo "go=false"       >> "$GITHUB_OUTPUT"
          fi

      # A manual run buzzes the phone once, so a test click verifies the whole
      # chain: secret -> script -> ntfy -> your lock screen.
      - name: Send a test push (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 halt_watcher.py --test

      - name: Watch halts
        if: steps.guard.outputs.go == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: '8'
          HALT_STATE: ${{ runner.temp }}/halt_state.json
        run: python3 halt_watcher.py --all-hours --until "${{ steps.guard.outputs.until }}"
