name: Halt watcher (afternoon)

# Starts 5 minutes before the morning leg ends so there is no coverage gap.
# The overlap is harmless: a fresh job "primes" from the current feed on its
# first poll and never alerts on halts it finds already sitting there.

on:
  schedule:
    - cron: '45 16 * * 1-5'   # 12:45 ET when US is on EDT
    - cron: '45 17 * * 1-5'   # 12:45 ET when US is on EST
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Manual run: how many minutes to watch for'
        required: false
        default: '10'

# Least privilege: these jobs only need to read the repo. The repo-wide
# default is read/write (the keepalive job needs it to push), and a workflow
# can only REDUCE that ceiling, never raise it -- so we reduce it here.
permissions:
  contents: read

concurrency:
  group: halt-watcher-afternoon
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run, and until when
        id: guard
        run: |
          ET=$(TZ=America/New_York date +%H%M)
          echo "New York time is $ET"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MINS="${{ inputs.minutes }}"
            UNTIL=$(TZ=America/New_York date -d "+${MINS:-10} minutes" +%H:%M)
            echo "Manual run — watching until $UNTIL ET."
            echo "go=true"        >> "$GITHUB_OUTPUT"
            echo "until=$UNTIL"   >> "$GITHUB_OUTPUT"
          elif [ "$ET" -ge "1230" ] && [ "$ET" -le "1310" ]; then
            echo "go=true"        >> "$GITHUB_OUTPUT"
            echo "until=16:10"    >> "$GITHUB_OUTPUT"
          else
            echo "Wrong DST leg — exiting cleanly."
            echo "go=false"       >> "$GITHUB_OUTPUT"
          fi

      # A manual run buzzes the phone once, so a test click verifies the whole
      # chain: secret -> script -> ntfy -> your lock screen.
      - name: Send a test push (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 halt_watcher.py --test

      - name: Watch halts
        if: steps.guard.outputs.go == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_SECONDS: '8'
          HALT_STATE: ${{ runner.temp }}/halt_state.json
        # --announce only on the real scheduled legs: two silent Telegram
        # messages a day bracketing each leg, so a leg that never started is
        # obvious instead of looking like a quiet market.
        run: |
          python3 halt_watcher.py --all-hours \
            ${{ github.event_name == 'schedule' && '--announce' || '' }} \
            --until "${{ steps.guard.outputs.until }}"
